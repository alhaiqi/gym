<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Log</title>
<meta name="description" content="Upper-body hypertrophy log: A/B rotation, adaptive week, exercise swaps, technique and history.">
<meta name="theme-color" content="#1E232B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Plate colours: blue = workout A, red = workout B, green = logged, yellow = rest. */
:root{
  --bg:#1E232B; --surface:#272D36; --raise:#313844; --line:#3A4350; --ink:#EEF1F4; --muted:#9AA4B2;
  --blue:#3D86F0; --red:#EE5257; --green:#3FB27F; --yellow:#F2C230; --on:#10141A;
  --w:var(--blue);
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --txt:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#EEF1F4; --surface:#FFFFFF; --raise:#E3E8EE; --line:#D3DAE3; --ink:#1E232B; --muted:#5B6573;
    --blue:#1F63CC; --red:#C9353A; --green:#1F8A5B; --yellow:#B88A00; --on:#FFFFFF; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#EEF1F4; --surface:#FFFFFF; --raise:#E3E8EE; --line:#D3DAE3; --ink:#1E232B; --muted:#5B6573;
  --blue:#1F63CC; --red:#C9353A; --green:#1F8A5B; --yellow:#B88A00; --on:#FFFFFF; color-scheme:light;
}
body[data-w="B"]{--w:var(--red)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--txt);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--w);outline-offset:2px}
.hide{display:none!important}
.app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font:700 26px/1 var(--num);letter-spacing:.01em}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* week strip: one plate per day */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:16px 0 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.plate{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 16px/1 var(--num);border:2px dashed var(--line);color:var(--muted);position:relative}
.plate::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:var(--bg);opacity:0}
.plate.A{border:0;background:var(--blue);color:#fff}
.plate.B{border:0;background:var(--red);color:#fff}
.plate.plan{background:none;border:2px dashed currentColor}
.plate.plan.A{color:var(--blue);border:2px dashed var(--blue);background:none}
.plate.plan.B{color:var(--red);border:2px dashed var(--red);background:none}
.wd.today b{color:var(--ink)}
.wd b{font-weight:600}
.wd.off .plate{opacity:.35}
.week-note{font-size:14px;color:var(--muted);margin:4px 0 0}

/* panels */
.panel{background:var(--surface);border-radius:var(--r-lg);padding:18px;margin-top:14px}
.panel.flat{background:none;padding:0}
.banner{background:color-mix(in srgb,var(--yellow) 16%,var(--surface));border-left:4px solid var(--yellow);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;font-size:15px}
h2{font:700 22px/1.15 var(--num);margin:0 0 4px;letter-spacing:.01em}
h3{font:600 19px/1.2 var(--num);margin:0;letter-spacing:.01em}

/* today hero */
.hero{position:relative;overflow:hidden;border-radius:var(--r-lg);background:var(--surface);padding:20px 18px 18px;margin-top:18px}
.hero .big{display:flex;align-items:baseline;gap:12px}
.hero .letter{font:700 92px/0.8 var(--num);color:var(--w)}
.hero .name{font:600 24px/1.1 var(--num)}
.hero .meta{color:var(--muted);font-size:15px;margin-top:6px}
.hero ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:2px}
.hero li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.hero li span:last-child{color:var(--muted);font-family:var(--num);font-size:16px;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border:0;border-radius:var(--r-md);background:var(--w);color:#fff;font:700 21px/1 var(--num);letter-spacing:.02em;cursor:pointer;margin-top:16px}
.cta:active{transform:scale(.985)}
.cta.green{background:var(--green)}
.link{background:none;border:0;padding:10px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--w)}

/* workout mode */
.wk-top{display:flex;align-items:center;gap:10px;min-height:48px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:22px;height:22px}
.wk-title{flex:1;font:600 18px/1.1 var(--num)}
.wk-title small{display:block;font:500 13px var(--txt);color:var(--muted)}
.bar{display:flex;gap:4px;margin:10px 0 18px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--raise)}
.bar i.done{background:var(--green)}
.bar i.now{background:var(--w)}
.ex-name{font:700 32px/1.02 var(--num);margin:0;letter-spacing:.005em}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:15px;margin-top:8px}
.ex-actions{display:flex;gap:8px;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.warn{color:var(--red);font-size:14px;margin-top:10px}
.hint{margin-top:14px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface);font-size:15px}
.hint b{color:var(--green)}
.sets-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.setchip{min-width:64px;padding:8px 10px;border-radius:var(--r-sm);background:var(--surface);border:2px solid transparent;text-align:center;cursor:pointer}
.setchip .n{display:block;font-size:12px;color:var(--muted)}
.setchip .v{font:600 18px/1.2 var(--num)}
.setchip.done{background:color-mix(in srgb,var(--green) 22%,var(--surface))}
.setchip.done .n{color:var(--green)}
.setchip.now{border-color:var(--w)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-lg);padding:10px;margin-top:12px}
.stepper button{height:64px;border-radius:var(--r-md);border:0;background:var(--raise);font:600 32px/1 var(--num);cursor:pointer}
.stepper button:active{background:var(--line)}
.stepper .mid{text-align:center}
.stepper input{width:100%;border:0;background:none;text-align:center;font:700 52px/1 var(--num);color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none;color:var(--w)}
.stepper label{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.dock .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center}
.dock .cta{margin:0;min-height:64px;font-size:23px}
.dock .icon-btn{width:56px;height:56px;border-radius:var(--r-md)}

/* rest timer: the plate */
.rest{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.rest .ring{position:relative;width:min(78vw,320px);aspect-ratio:1}
.rest svg{width:100%;height:100%;transform:rotate(-90deg)}
.rest .face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest .t{font:700 clamp(72px,24vw,112px)/1 var(--num);font-variant-numeric:tabular-nums}
.rest .lbl{color:var(--muted);font-size:15px}
.rest.go .t{color:var(--green)}
.rest .next{margin-top:22px;font-size:16px;max-width:320px}
.rest .next b{font:600 20px var(--num);display:block}
.rest .btns{display:flex;gap:10px;margin-top:22px}
.rest .btns button{min-width:92px;min-height:52px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);font:600 18px var(--num);cursor:pointer}
.rest .btns .go-btn{background:var(--yellow);color:#1E232B;border:0;min-width:120px}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid transparent;background:var(--surface);border-radius:var(--r-md);padding:10px;margin:8px 0;cursor:pointer}
.opt.on{border-color:var(--w)}
.opt img{width:72px;height:54px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.opt .ph{width:72px;height:54px;border-radius:8px;background:var(--raise);flex:none}
.opt b{display:block;font:600 18px/1.15 var(--num)}
.opt small{color:var(--muted);font-size:13px}
.jump{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.jump .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 14px var(--num);background:var(--raise);flex:none}
.jump .dot.done{background:var(--green);color:#fff}
.jump .dot.now{background:var(--w);color:#fff}

/* technique */
.anim{position:relative;width:100%;aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;background:#fff}
.anim img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.anim img.f1{animation:flip 2.6s infinite}
@keyframes flip{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){.anim img.f1{animation:none;opacity:0}.sheet{animation:none}}
.tech h4{font:600 18px var(--num);margin:16px 0 6px}
.tech ol,.tech ul{margin:0;padding-left:22px}
.tech li{margin:5px 0}
.tech .bad{list-style:none;padding-left:0}
.tech .bad li{padding-left:24px;position:relative}
.tech .bad li::before{content:"✕";position:absolute;left:2px;color:var(--red);font-weight:700}

/* lists, tables */
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{list-style:none;margin:10px 0 0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list img{width:56px;height:42px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.list .ph{width:56px;height:42px;border-radius:8px;background:var(--raise);flex:none}
.list .grow{flex:1;min-width:0}
.list b{display:block;font:600 17px/1.2 var(--num)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:9px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
td.n{font:600 17px var(--num);text-align:right;white-space:nowrap}
select{width:100%;padding:12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px}
.spark{display:flex;align-items:flex-end;gap:4px;height:90px;margin:14px 0 6px}
.spark i{flex:1;background:var(--w);border-radius:4px 4px 0 0;min-height:4px}
.spark i:last-child{background:var(--green)}
.sess{padding:12px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .tag{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font:700 14px var(--num);margin-right:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px 16px;font-weight:600;cursor:pointer;font-size:15px}
.summary{text-align:center;padding-top:30px}
.summary .stat{display:inline-block;margin:10px 14px}
.summary .stat b{display:block;font:700 46px/1 var(--num)}
.pr{display:inline-block;background:var(--yellow);color:#1E232B;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;margin-left:6px}
</style>
</head>
<body data-w="A">
<main class="app" id="app"></main>
<nav class="nav" id="nav" aria-label="Sections"><div class="in">
  <button data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="5" y="6" width="3" height="12" rx="1"/><rect x="16" y="6" width="3" height="12" rx="1"/><path d="M8 12h8"/></svg>Today</button>
  <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Plan</button>
  <button data-view="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-view="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Guide</button>
</div></nav>
<div id="dock" class="dock hide"></div>
<div id="rest" class="rest hide" role="dialog" aria-label="Rest timer"></div>
<div id="sheetBg" class="sheet-bg hide"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="data.js"></script>
<script src="tips.js"></script>
<script>
/* ================= state ================= */
const KEY = "gymlog-v2";
function readLS(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)) }catch(e){} }
function fresh(){ return {v:2,next:"A",target:4,history:[],draft:{},swaps:{},ramp:true,rampAuto:true,bad:false,firstDate:null,dayDraft:null,active:null} }
function migrate(s){
  if(!s || !Array.isArray(s.history)) return null;
  const out = Object.assign(fresh(), s);
  out.v = 2; out.swaps = out.swaps || {}; out.target = out.target || 4;
  if(s.v !== 2) out.draft = {};
  out.history = out.history.filter(h => h && h.date && h.ex).map(h => ({date:h.date, w:h.w || "A", ex:h.ex}));
  out.history.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  if(!out.firstDate && out.history.length) out.firstDate = out.history[0].date;
  if(out.rampAuto === undefined) out.rampAuto = true;
  return out;
}
let state = (() => {
  let s = null; try{ s = JSON.parse(readLS(KEY)) }catch(e){}
  if(s) return migrate(s) || fresh();
  try{ const old = JSON.parse(readLS("ubl-v1")); if(old) return migrate(old) || fresh() }catch(e){}
  return fresh();
})();
let view = "home";

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => n < 10 ? "0"+n : ""+n;
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d) };
const dayIdx = d => (d.getDay()+6)%7;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x };
const daysBetween = (a,b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const today = () => ymd(new Date());
const other = L => L === "A" ? "B" : "A";
const allSlots = () => [...DAYS.A.slots, ...DAYS.B.slots];
const exFor = slot => state.swaps[slot.id] || slot.def;
const fmtRest = s => s >= 120 ? (s/60)+" min" : s+" s";
const hasImg = id => !["assist_pullup","machine_lat"].includes(id);
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : 0 };
const trim = n => +(+n).toFixed(2);
function setsFor(slot){ let s = slot.s; if(state.ramp && s === 3) s = 2; if(state.bad) s = Math.max(1, s-1); return s }
function stepOf(id){ const u = UNIT[id] || "stack"; return u === "db" ? 1 : u === "bw" ? 0 : u === "assist" ? 5 : 2.5 }
function lastFor(exId, before){
  for(let i = state.history.length-1; i >= 0; i--){
    const h = state.history[i];
    if(before && h.date >= before) continue;
    const rows = h.ex[exId];
    if(rows && rows.some(x => x.w || x.r)) return {date:h.date, sets:rows.filter(x => x.w || x.r)};
  }
  return null;
}
function fmtSets(rows){ return rows.filter(x => x.w || x.r).map(x => (x.w ? x.w : "–")+"×"+(x.r || "–")).join(", ") }
function suggestion(exId){
  const e = LIB[exId], last = lastFor(exId), u = UNIT[exId];
  if(!last) return {text:"First time: pick a weight you can lift for "+e.lo+" reps with 1–2 left in the tank."};
  const reps = last.sets.map(x => +x.r || 0), ws = last.sets.map(x => num(x.w));
  const top = Math.max(...ws);
  if(reps.length && reps.every(r => r >= e.hi)){
    if(u === "bw") return {up:true, text:"You hit "+e.hi+" reps on every set. Slow the reps down or hold a light dumbbell."};
    if(u === "assist"){ const low = Math.min(...ws.filter(w => w > 0)); const nw = isFinite(low) ? Math.max(0, low-5) : ""; return {up:true, w:nw, text:"You hit "+e.hi+" on every set. Lower the assist"+(nw !== "" ? " to "+nw+" kg" : "")+"."}; }
    const nw = top ? trim(top + stepOf(exId) * (e.c ? 1 : 1)) : "";
    return {up:true, w:nw, text:"You hit "+e.hi+" reps on every set last time. Go up to "+(nw ? nw+" kg" : "the next weight")+"."};
  }
  return {w: top || "", text:"Same weight"+(top ? " ("+top+" kg)" : "")+". Beat last time by one rep."};
}
function e1rm(w, r){ return num(w) * (1 + (+r || 0)/30) }

/* ================= week plan ================= */
function weekPlan(){
  const now = new Date(), ti = dayIdx(now), sunday = ti === 6;
  const monday = addDays(now, sunday ? 1 : -ti), mondayStr = ymd(monday);
  const trained = new Map();
  if(!sunday) state.history.forEach(h => { const d = daysBetween(mondayStr, h.date); if(d >= 0 && d <= 6) trained.set(d, h.w) });
  const trainedToday = !sunday && trained.has(ti);
  const start = sunday ? 0 : (trainedToday ? ti+1 : ti);
  const cand = []; for(let d = start; d <= 5; d++) if(!trained.has(d)) cand.push(d);
  const need = Math.max(0, state.target - [...trained.keys()].filter(d => d <= 5).length);
  const k = Math.min(need, cand.length);
  let best = [], bestScore = Infinity;
  (function pick(i, acc){
    if(acc.length === k){
      const all = [...trained.keys(), ...acc].sort((a,b) => a-b);
      let cons = 0, minGap = 9;
      for(let j = 1; j < all.length; j++){ const g = all[j]-all[j-1]; if(g === 1) cons++; if(g < minGap) minGap = g; }
      const score = cons*100 - minGap*10 + acc.reduce((a,b) => a+b, 0)*0.1;
      if(score < bestScore){ bestScore = score; best = acc.slice(); }
      return;
    }
    for(let j = i; j < cand.length; j++){ acc.push(cand[j]); pick(j+1, acc); acc.pop(); }
  })(0, []);
  const letters = {}; let L = currentLetter();
  best.forEach(d => { letters[d] = L; L = other(L) });
  return {sunday, ti, monday, trained, trainedToday, plan:best, letters, need, short:need-k, todayPlanned:best.includes(ti)};
}
function currentLetter(){
  if(state.active) return state.active.L;
  return state.dayDraft && state.dayDraft.date === today() ? state.dayDraft.L : state.next;
}

/* ================= drafts ================= */
function getDraft(L, slot){
  const d = state.draft[L] || (state.draft[L] = {});
  const exId = exFor(slot);
  let cur = d[slot.id];
  if(!cur || cur.ex !== exId) cur = d[slot.id] = {ex:exId, rows:[]};
  const n = setsFor(slot);
  while(cur.rows.length < n) cur.rows.push({w:"", r:"", done:false});
  if(cur.rows.length > n) cur.rows = cur.rows.slice(0, Math.max(n, cur.rows.filter(x => x.done).length));
  return cur;
}
function defaults(cur, i){
  const e = LIB[cur.ex], sug = suggestion(cur.ex), last = lastFor(cur.ex);
  const prevDone = cur.rows.slice(0, i).reverse().find(x => x.done);
  let w = prevDone ? prevDone.w : (sug.w !== undefined && sug.w !== "" ? sug.w : (last && last.sets[i] ? last.sets[i].w : (last ? last.sets[0].w : "")));
  let r = prevDone ? prevDone.r : (sug.up ? e.lo : (last && last.sets[i] ? last.sets[i].r : e.lo));
  if(UNIT[cur.ex] === "bw") w = "";
  return {w: w === "" ? "" : trim(num(w)), r: +r || e.lo};
}
function slotDone(L, slot){ const cur = state.draft[L] && state.draft[L][slot.id]; return !!(cur && cur.ex === exFor(slot) && cur.rows.length && cur.rows.every(x => x.done)) }
function anyLogged(L){ const d = state.draft[L] || {}; return Object.values(d).some(c => c.rows.some(x => x.done)) }

  save();
}

function logSet(){

function finishWorkout(){
  const L = state.active ? state.active.L : currentLetter(), d = state.draft[L] || {};

  if(!Object.keys(ex).length){ if(!confirm("No sets logged yet. Leave without saving?")) return; state.active = null; view = "home"; stopRest(); render(); return; }
  const date = today();

      <p class="muted small" style="margin:0">${DAYS[L].name}</p>
      <ul class="list">${DAYS[L].slots.map(s => { const id = exFor(s), e = LIB[id];
        return `<li>${hasImg(id) ? `<img src="img/${id}-1.jpg" alt="" loading="lazy">` : '<span class="ph"></span>'}<div class="grow"><b>${esc(e.n)}</b><span class="muted small">${esc(s.m)}, ${s.s} × ${e.lo}–${e.hi}, rest ${fmtRest(e.rest)}${id !== s.def ? ", swapped" : ""}</span></div><button class="pill" data-techid="${id}" aria-label="Technique for ${esc(e.n)}">How</button><button class="pill" data-act="swap" data-slot="${s.id}">Swap</button></li>` }).join("")}</ul></section>`).join("")}
    <section class="panel"><h2>Weekly sets per muscle</h2><p class="muted small" style="margin:0">At ${state.target} sessions a week. Swaps keep the same muscle, so these don't change.</p>
      <table style="margin-top:8px">${vol.map(([m, ids]) => { const s = ids.reduce((a,id) => a + all.find(x => x.id === id).s, 0); const wk = state.target === 4 ? s*2 : Math.round(s*1.5); return `<tr><td>${m}</td><td class="n">${state.target === 4 ? "" : "~"}${wk}</td></tr>` }).join("")}</table></section>
    <section class="panel"><h2>Your week</h2><table>
      <tr><td>4 days</td><td>Mon, Tue, Thu, Sat</td></tr><tr><td>3 days</td><td>Mon, Wed, Fri</td></tr>
      <tr><td>Missed a day</td><td>Today re-plans the rest of the week. The A/B rotation just continues.</td></tr>
      <tr><td>Gym hours</td><td>Mon–Fri until 9:30 pm (arrive by 7:30), Sat 9:00–4:30. Book in the AUB CHSC app.</td></tr></table></section>`;
}

/* ---------- progress ---------- */
let progId = null;
function renderProgress(){
  const ids = Object.keys(LIB).filter(id => lastFor(id));
  if(!ids.includes(progId)) progId = ids[0] || null;
  let chart = "";
  if(progId){
    const rows = state.history.filter(h => h.ex[progId] && h.ex[progId].some(x => x.w || x.r)).map(h => ({date:h.date, sets:h.ex[progId], best:Math.max(...h.ex[progId].map(x => e1rm(x.w, x.r)))}));
    const max = Math.max(1, ...rows.map(r => r.best)), show = rows.slice(-12);
    chart = `<div class="spark" aria-hidden="true">${show.map(r => `<i style="height:${Math.max(4, r.best/max*100)}%"></i>`).join("")}</div>
      <p class="muted small" style="margin:0 0 6px">Bars show estimated strength (best set), oldest to newest.</p>
      <table>${rows.slice().reverse().map(r => `<tr><td>${esc(r.date)}</td><td>${esc(fmtSets(r.sets))}</td><td class="n">${r.best ? Math.round(r.best)+" kg" : ""}</td></tr>`).join("")}</table>`;
  }
  $("#app").innerHTML = `<header class="top"><div class="brand">Progress</div><span class="muted small">${state.history.length} sessions</span></header>
    <section class="panel"><h2>By exercise</h2>${ids.length ? `<select id="progSel" aria-label="Exercise">${ids.map(id => `<option value="${id}" ${id === progId ? "selected" : ""}>${esc(LIB[id].n)}</option>`).join("")}</select>${chart}` : `<p class="muted" style="margin:0">Log your first workout and your lifts show up here.</p>`}</section>
    <section class="panel"><h2>Sessions</h2>${state.history.length ? state.history.map((h,idx) => ({h,idx})).reverse().map(({h,idx}) => `<div class="sess"><div class="row"><div><span class="tag" style="background:var(--${h.w === "A" ? "blue" : "red"})">${esc(h.w)}</span><b>${DOW[dayIdx(parseYmd(h.date))]} ${esc(h.date)}</b></div><button class="link" data-del="${idx}">Delete</button></div>
      ${Object.keys(h.ex).map(id => `<div class="small"><span class="muted">${esc(LIB[id] ? LIB[id].n : id)}:</span> ${esc(fmtSets(h.ex[id]))}</div>`).join("") || '<div class="muted small">No sets</div>'}</div>`).join("") : `<p class="muted" style="margin:0">No sessions yet.</p>`}</section>
    <section class="panel"><h2>Backup</h2><p class="muted small" style="margin:0 0 12px">Your log lives in this browser on this device. Export it now and then, and import it on a new phone or laptop.</p>
      <div class="row" style="justify-content:flex-start"><button class="btn" data-act="export">Export log</button><label class="btn">Import log<input type="file" id="importInput" accept="application/json,.json" class="hide"></label></div></section>`;
}

/* ---------- guide ---------- */
function renderGuide(){
  $("#app").innerHTML = `<header class="top"><div class="brand">Guide</div></header>
    <section class="panel"><h2>Recording the weight</h2><table>
      <tr><td>Dumbbells</td><td>One dumbbell. Two 12s → 12</td></tr>
      <tr><td>Barbell, EZ bar</td><td>Total with the bar. 20 bar + 10 each side → 40</td></tr>
      <tr><td>Cable, pin machine</td><td>The number on the stack</td></tr>
      <tr><td>Plate-loaded machine</td><td>All plates, both sides added</td></tr>
      <tr><td>Smith machine</td><td>Plates only, both sides added</td></tr>
      <tr><td>Assisted pull-up, dip</td><td>The assist weight. Lower is harder</td></tr>
      <tr><td>Hanging knee raise</td><td>Reps only</td></tr></table>
      <p class="muted small" style="margin:10px 0 0">Record the same way every time; the app compares you with your own last session.</p></section>
    <section class="panel"><h2>Getting stronger</h2><ol style="margin:0;padding-left:20px">
      <li>Start with a weight you can lift for the bottom of the rep range.</li>
      <li>Add reps each session until every set reaches the top.</li>
      <li>Then add a little weight and start from the bottom again. The app tells you when.</li></ol></section>
    <section class="panel"><h2>Effort</h2><ul style="margin:0;padding-left:20px">
      <li>Stop most sets with 1–2 reps left.</li><li>Exercises marked "last set to failure" can go all the way on the final set.</li>
      <li>Warm up: 2 light sets of the first exercise, plus light laterals or face pulls.</li></ul></section>
    <section class="panel"><h2>Your shoulder</h2><ul style="margin:0;padding-left:20px">
      <li>Skip the plate-loaded reverse-grip pulldown machine; it's the one that clicks.</li>
      <li>Clicking without pain is fine. If something hurts, swap it, and get it checked if it keeps hurting.</li>
      <li>Ask the fitness specialist to spot heavy bench sets, or use the safety bars.</li></ul></section>
    <section class="panel"><h2>Is it working?</h2><ul style="margin:0;padding-left:20px">
      <li>Most lifts going up every 1–2 weeks.</li><li>Weekly average body weight rising about 0.15–0.3 kg.</li>
      <li>Weight flat for two weeks: eat a bit more. Gaining much faster: a bit less.</li></ul></section>
    <section class="panel"><h2>The app</h2><p class="small" style="margin:0">Install it from Chrome's menu with <b>Add to Home screen</b> (iPhone: Share, then Add to Home Screen). It works offline.</p>
      <button class="btn hide" id="installBtn" style="margin-top:12px">Install app</button>
      <p class="muted small" style="margin:12px 0 0">Theme: <button class="link" data-theme="">auto</button> · <button class="link" data-theme="dark">dark</button> · <button class="link" data-theme="light">light</button></p>
      <p class="muted small" style="margin:6px 0 0">Exercise pictures from <a class="muted" href="https://github.com/yuhonas/free-exercise-db" target="_blank" rel="noopener">free-exercise-db</a> (public domain).</p></section>`;
  if(deferredPrompt) $("#installBtn").classList.remove("hide");
}

/* ================= events ================= */
document.addEventListener("click", ev => {
  if(ev.target === $("#sheetBg")){ closeSheet(); return; }
  const t = ev.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.view){ view = d.view; render(); window.scrollTo(0,0); return; }
  if(d.target){ state.target = +d.target; render(); return; }
  if(d.toggle){ if(d.toggle === "ramp"){ state.ramp = !state.ramp; state.rampAuto = false } else state.bad = !state.bad; render(); return; }
  if(d.rest){ if(d.rest === "skip") stopRest(); else { restEnd = Math.max(restEnd, Date.now()) + (+d.rest)*1000; restTotal = Math.max(restTotal, (restEnd-Date.now())/1000); if(!restInt){ $("#rest").classList.remove("go"); restInt = setInterval(tickRest, 200) } tickRest(); } return; }
  if(d.step){
    const a = state.active, cur = getDraft(a.L, DAYS[a.L].slots[a.i]);
    const inp = d.step === "w" ? $("#wIn") : $("#rIn");
    const step = d.step === "w" ? (stepOf(cur.ex) || 1) : 1;
    let v = num(inp.value) + (+d.d) * step; if(v < 0) v = 0;
    inp.value = d.step === "w" ? trim(v) : Math.round(v);
    try{ navigator.vibrate && navigator.vibrate(8) }catch(e){}
    return;
  }
  if(d.set !== undefined){
    const a = state.active, cur = getDraft(a.L, DAYS[a.L].slots[a.i]), i = +d.set;
    a.edit = cur.rows[i].done ? i : null; render(); return;
  }
  if(d.pick){
    const slot = allSlots().find(s => s.id === d.slot);
    if(d.pick === slot.def) delete state.swaps[slot.id]; else state.swaps[slot.id] = d.pick;
    closeSheet(); render(); return;
  }
  if(d.techid){ openSheet(techHTML(d.techid)); return; }
  if(d.goto !== undefined){ state.active.i = +d.goto; state.active.edit = null; closeSheet(); render(); window.scrollTo(0,0); return; }
  if(d.reset){ DAYS[d.reset].slots.forEach(s => delete state.swaps[s.id]); render(); return; }
  if(d.del !== undefined){ if(confirm("Delete this session from your history?")){ state.history.splice(+d.del, 1); render(); } return; }
  if(d.theme !== undefined){ if(d.theme) document.documentElement.dataset.theme = d.theme; else delete document.documentElement.dataset.theme; try{ localStorage.setItem("gymlog-theme", d.theme) }catch(e){} return; }
  if(t.hasAttribute("data-close")){ closeSheet(); return; }
  switch(d.act){
    case "start":
      if(!state.active || state.active.L !== currentLetter()){
        const L = currentLetter(); state.active = {L, i:0, edit:null};
        const firstOpen = DAYS[L].slots.findIndex(s => !slotDone(L, s)); state.active.i = firstOpen < 0 ? 0 : firstOpen;
      }
      view = "workout"; render(); window.scrollTo(0,0); break;
    case "swapday": state.dayDraft = {date:today(), L:other(currentLetter())}; if(state.active && !anyLogged(state.active.L)) state.active = null; render(); break;
    case "leave": view = "home"; stopRest(); render(); break;
    case "jump": openSheet(jumpHTML()); break;
    case "tech": { const a = state.active; openSheet(techHTML(exFor(DAYS[a.L].slots[a.i]))); break; }
    case "swap": openSheet(swapHTML(d.slot)); break;
    case "log": logSet(); break;
    case "addset": { const a = state.active, cur = getDraft(a.L, DAYS[a.L].slots[a.i]); cur.rows.push({w:"",r:"",done:false}); render(); break; }
    case "prev": if(state.active.i > 0){ state.active.i--; state.active.edit = null; render(); window.scrollTo(0,0) } break;
    case "next": if(state.active.i < DAYS[state.active.L].slots.length-1){ state.active.i++; state.active.edit = null; render(); window.scrollTo(0,0) } break;
    case "finish": closeSheet(); finishWorkout(); break;
    case "export": {
      const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"}), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "gym-log-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); break;
    }
  }
});
document.addEventListener("change", ev => {
  if(ev.target.id === "progSel"){ progId = ev.target.value; render(); }
  if(ev.target.id === "importInput"){
    const f = ev.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => { try{ const s = migrate(JSON.parse(rd.result)); if(!s) throw 0;
      if(state.history.length && !confirm("Replace your current log ("+state.history.length+" sessions) with the imported one ("+s.history.length+" sessions)?")) return;
      state = s; render(); alert("Imported "+s.history.length+" sessions."); }catch(err){ alert("That file isn't a Gym Log export.") } };
    rd.readAsText(f);
  }
});
document.addEventListener("keydown", ev => { if(ev.key === "Escape"){ closeSheet(); } if(ev.key === "Enter" && (ev.target.id === "wIn" || ev.target.id === "rIn")){ ev.preventDefault(); logSet(); } });
document.addEventListener("focusin", ev => { if(ev.target.id === "wIn" || ev.target.id === "rIn") ev.target.select() });

/* ================= install / offline ================= */
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; const b = $("#installBtn"); if(b) b.classList.remove("hide") });
document.addEventListener("click", async ev => { if(ev.target.id === "installBtn" && deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; ev.target.classList.add("hide") } });
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist() }catch(e){}
try{ const th = localStorage.getItem("gymlog-theme"); if(th) document.documentElement.dataset.theme = th }catch(e){}

/* ================= start ================= */
const h = (location.hash || "").slice(1);
if(["plan","progress","guide"].includes(h)) view = h;
if(h === "history") view = "progress";
render();
</script>
</body>
</html>
