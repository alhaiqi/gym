<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groceries</title>
<meta name="description" content="Weekly grocery list from your meal plan, with automatic swaps when something is out of stock.">
<meta name="theme-color" content="#1E232B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1E232B; --surface:#272D36; --raise:#313844; --line:#3A4350; --ink:#EEF1F4; --muted:#9AA4B2;
  --green:#3FB27F; --yellow:#F2C230; --red:#EE5257; --blue:#3D86F0;
  --num:"Barlow Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --txt:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#EEF1F4;--surface:#FFFFFF;--raise:#E3E8EE;--line:#D3DAE3;--ink:#1E232B;--muted:#5B6573;--green:#1F8A5B;--yellow:#B88A00;--red:#C9353A;--blue:#1F63CC;color-scheme:light}
}
:root[data-theme="light"]{--bg:#EEF1F4;--surface:#FFFFFF;--raise:#E3E8EE;--line:#D3DAE3;--ink:#1E232B;--muted:#5B6573;--green:#1F8A5B;--yellow:#B88A00;--red:#C9353A;--blue:#1F63CC;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--txt);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.hide{display:none!important}
.app{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)} .small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.brand{font:700 26px/1 var(--num)}
.back{color:var(--muted);font-size:14px;text-decoration:none}
h2{font:700 22px/1.15 var(--num);margin:0}
h3{font:600 19px/1.2 var(--num);margin:0}
.panel{background:var(--surface);border-radius:20px;padding:16px 16px 6px;margin-top:14px}
.summary{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end;margin-top:14px}
.summary .big{font:700 46px/1 var(--num)}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--raise);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .3s}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer}
.cat{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 2px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.check{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer}
.check svg{width:22px;height:22px;opacity:0}
.item.got .check{background:var(--green);border-color:var(--green)}
.item.got .check svg{opacity:1;color:#fff}
.item.got .name{text-decoration:line-through;color:var(--muted)}
.name{font:600 18px/1.2 var(--num)}
.qty{font:700 22px/1 var(--num);text-align:right;white-space:nowrap}
.qty small{display:block;font:500 13px var(--txt);color:var(--muted);margin-top:3px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.moved{font-size:13px;color:var(--yellow);margin-top:2px}
.out-btn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0;cursor:pointer}
.item.out{opacity:.55}
.item.out .name{text-decoration:line-through}
.item.out .out-btn{color:var(--red)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.nav svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{color:var(--green)}
.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.field:first-of-type{border-top:0}
.field label{flex:1}
.field small{display:block;color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:40px;height:40px;border-radius:10px;border:0;background:var(--raise);font:600 22px/1 var(--num);cursor:pointer}
.stepper input{width:58px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;font:600 18px var(--num)}
.groupsum{font-size:13px;margin:4px 0 8px}
.groupsum.ok{color:var(--green)} .groupsum.off{color:var(--yellow)}
.form{display:grid;gap:8px;margin:8px 0 12px}
.form input,.form select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cta{width:100%;min-height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font:700 19px var(--num);cursor:pointer}
.link{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90vw}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
td{padding:6px 2px;border-top:1px solid var(--line)} td.n{text-align:right;font-family:var(--num);font-size:16px}
</style>
</head>
<body>
<main class="app" id="app"></main>
<nav class="nav" aria-label="Sections"><div class="in">
  <button data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h2l2 11h11l2-8H7"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>List</button>
  <button data-view="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"/><circle cx="18" cy="16" r="3"/></svg>My plan</button>
  <button data-view="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Add item</button>
</div></nav>

<script>
/* ============ the plan (from the doctor's meal plan, ٢ amounts) ============
   Each group is one need. perDay = servings a day. Items in a group can replace each other:
   share = servings a week by default; if an item is marked "not available",
   its servings move to the next available item in the group's order. */
const CATS = ["Vegetables","Fruit","Protein & dairy","Bread & grains","Nuts & extras","Pantry"];
const GROUPS = [
  {id:"salad", cat:"Vegetables", name:"Raw vegetables", unit:"cup", perDay:4, why:"1 cup at breakfast, 1 cup salad at lunch, 2 cups salad at dinner",
   items:[
    {id:"tomato", n:"Tomatoes", g:180, piece:90, pn:"tomato", share:10, usd:0.88},
    {id:"cucumber", n:"Small cucumbers", g:150, piece:75, pn:"cucumber", share:8, usd:1.06},
    {id:"carrot", n:"Carrots", g:125, piece:60, pn:"carrot", share:6, usd:1.05},
    {id:"lettuce", n:"Lettuce", g:50, piece:400, pn:"head", share:4, upc:0.87},
    {id:"pepper", n:"Bell peppers", g:150, piece:150, pn:"pepper", share:0},
    {id:"cherry", n:"Cherry tomatoes", g:150, share:0}
   ]},
  {id:"stew", cat:"Vegetables", name:"Stew vegetables (طبيخ)", unit:"cup cooked", perDay:1.5, why:"1½ cups vegetable stew at lunch",
   items:[
    {id:"zucchini", n:"Zucchini (كوسا)", g:190, share:5.5, usd:0.99},
    {id:"eggplant", n:"Eggplant (بادنجان)", g:190, share:5, usd:0.95},
    {id:"okra", n:"Okra (باميا)", g:150, share:0},
    {id:"cabbage", n:"Cabbage", g:190, share:0, usd:0.45},
    {id:"greenbeans", n:"Green beans", g:150, share:0, usd:1.66}
   ]},
  {id:"onion", cat:"Vegetables", name:"Onion for the stew", unit:"½ kg", fixed:1, why:"base for the week's stew",
   items:[{id:"onion", n:"Onions", g:500, piece:150, pn:"onion", share:1, usd:0.58}]},
  {id:"potato", cat:"Vegetables", name:"Boiled potato", unit:"½ cup", perDay:1, why:"½ cup boiled potato at lunch (one small potato)",
   items:[{id:"potato", n:"Small potatoes", g:130, piece:130, pn:"potato", share:7, usd:0.69}]},
  {id:"fruit", cat:"Fruit", name:"Fruit", unit:"serving", perDay:3, why:"2 in the morning snack + 1 in the afternoon snack",
   items:[
    {id:"banana", n:"Bananas", g:125, piece:125, pn:"banana", share:7, usd:1.37},
    {id:"orange", n:"Oranges", g:200, piece:200, pn:"orange", share:7, usd:1.26},
    {id:"pear", n:"Local pears", g:180, piece:180, pn:"pear", share:5, usd:1.36},
    {id:"apple", n:"Local apples", g:180, piece:180, pn:"apple", share:2, usd:2.21},
    {id:"mandarin", n:"Mandarins", g:150, piece:75, pn:"mandarin", share:0, usd:2.79},
    {id:"grapes", n:"Grapes", g:100, share:0, usd:4.07},
    {id:"strawberry", n:"Strawberries", g:100, piece:17, pn:"strawberry", share:0, usd:12.55}
   ]},
  {id:"breakfast", cat:"Protein & dairy", name:"Breakfast protein", unit:"breakfast", perDay:1, why:"2 boiled eggs, or 2 cups beans/foul (your notes allow the swap)",
   items:[
    {id:"eggs", n:"Eggs", count:2, pn:"egg", share:7},
    {id:"foul", n:"Foul / beans (400 g cans)", count:1.3, pn:"can", share:0}
   ]},
  {id:"protein", cat:"Protein & dairy", name:"Lunch protein", unit:"piece (30 g cooked)", perDay:5, why:"5 pieces × 30 g at lunch; raw weight is about a third more",
   items:[
    {id:"chickenbreast", n:"Chicken breast", g:40, share:25},
    {id:"chickenthigh", n:"Chicken thigh, boneless", g:40, share:6},
    {id:"fish", n:"Fish fillet", g:40, share:4},
    {id:"meat", n:"Lean meat", g:40, share:0}
   ]},
  {id:"cheese", cat:"Protein & dairy", name:"Salty cheese", unit:"slice (30 g)", perDay:1, why:"1 slice at dinner",
   items:[
    {id:"halloumi", n:"Halloumi", g:30, share:7},
    {id:"nabulsi", n:"Nabulsi", g:30, share:0},
    {id:"akkawi", n:"Akkawi", g:30, share:0},
    {id:"feta", n:"Feta", g:30, share:0}
   ]},
  {id:"milk", cat:"Protein & dairy", name:"Milk", unit:"cup (240 ml)", perDay:2, why:"2 cups in the morning drink",
   items:[{id:"milk", n:"Milk", ml:240, share:14}]},
  {id:"laban", cat:"Protein & dairy", name:"Laban after training", unit:"small cup", perDay:"training", why:"1 small laban/yogurt right after each workout",
   items:[{id:"laban", n:"Laban (حقين) small cups", count:1, pn:"cup", share:4},{id:"yogurt", n:"Small yogurt cups", count:1, pn:"cup", share:0}]},
  {id:"bread_b", cat:"Bread & grains", name:"Bread at breakfast", unit:"loaf", perDay:2, why:"2 brown loaves at breakfast",
   items:[{id:"brownbread", n:"Brown bread (رغيف أسمر)", count:1, pn:"loaf", share:14}]},
  {id:"bread_d", cat:"Bread & grains", name:"Bread at dinner", unit:"dinner", perDay:1, why:"2 brown loaves, or 3 toast slices",
   items:[{id:"brownbread_d", n:"Brown bread (رغيف أسمر)", count:2, pn:"loaf", share:7, merge:"brownbread"},{id:"toast", n:"Toast slices", count:3, pn:"slice", share:0}]},
  {id:"carb", cat:"Bread & grains", name:"Rice or pasta", unit:"cup cooked", perDay:2, why:"2 cups cooked rice or pasta at lunch",
   items:[{id:"rice", n:"Rice (dry)", g:62, share:7},{id:"pasta", n:"Pasta (dry)", g:75, share:7},{id:"bulgur", n:"Bulgur (dry)", g:60, share:0}]},
  {id:"ricecake", cat:"Bread & grains", name:"Rice cakes before training", unit:"cake", perDay:3, why:"3 rice cakes before the workout",
   items:[{id:"ricecakes", n:"Rice cakes", count:1, pn:"cake", share:21}]},
  {id:"almond", cat:"Nuts & extras", name:"Almonds", unit:"almond", perDay:12, why:"6 in the morning drink + 6 in the afternoon",
   items:[{id:"almonds", n:"Almonds", g:1.2, share:84}]},
  {id:"nuts", cat:"Nuts & extras", name:"Other nuts", unit:"nut", perDay:6, why:"6 walnuts (or any nut you like) in the morning drink",
   items:[{id:"walnuts", n:"Walnuts", g:4, share:42},{id:"cashews", n:"Cashews", g:1.6, share:0}]},
  {id:"olives", cat:"Nuts & extras", name:"Black olives", unit:"olive", perDay:8, why:"8 black olives at breakfast",
   items:[{id:"olives", n:"Black olives", g:4, share:56}]},
  {id:"pb", cat:"Nuts & extras", name:"Peanut butter", unit:"tbsp", perDay:1, why:"1 tablespoon with the rice cakes",
   items:[{id:"peanutbutter", n:"Peanut butter", g:16, share:7}]},
  {id:"oil", cat:"Pantry", name:"Olive oil", unit:"tsp", perDay:1, why:"1 teaspoon on the stew or salad",
   items:[{id:"oliveoil", n:"Olive oil", ml:5, share:7}]}
];
const PANTRY = [{id:"honey", n:"Honey", why:"for low energy during training, or with black seed"},{id:"blackseed", n:"Black seed (حبة سوداء)", why:"a pinch with honey in the morning"},{id:"salt", n:"Salt", why:"for the cheese brine"}];

/* ============ state ============ */
const KEY = "groceries-v1";
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {} }catch(e){ return {} } }
let st = Object.assign({days:7, training:4, perDay:{}, shares:{}, out:{}, got:{}, custom:[], hidden:{}, prices:true}, load());
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)) }catch(e){} }
let view = "list";
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r1 = n => Math.round(n*10)/10;

function perDayOf(g){ if(g.perDay === "training") return null; const v = st.perDay[g.id] != null ? st.perDay[g.id] : (g.fixed != null ? g.fixed : g.perDay); return v }
function weekServings(g){ if(g.perDay === "training") return st.training; if(g.fixed != null) return perDayOf(g) * st.days / 7; return perDayOf(g) * st.days }
function shareOf(g, it){ return st.shares[it.id] != null ? st.shares[it.id] : it.share }

/* Allocation: split the week's servings by share, then move "not available" items' servings
   to the next available item in the group (wrapping around). */
function allocate(g){
  const total = weekServings(g);
  const shares = g.items.map(it => Math.max(0, shareOf(g, it)));
  const sum = shares.reduce((a,b) => a+b, 0) || 1;
  const alloc = g.items.map((it,i) => ({it, base: total * shares[i] / sum, moved:0, from:[]}));
  const n = alloc.length;
  alloc.forEach((a,i) => {
    if(!st.out[a.it.id] || a.base <= 0) return;
    for(let k = 1; k < n; k++){
      const b = alloc[(i+k) % n];
      if(!st.out[b.it.id]){ b.moved += a.base; b.from.push(a.it.n); return; }
    }
  });
  return alloc.map(a => ({...a, total: st.out[a.it.id] ? 0 : a.base + a.moved}));
}

/* Turn servings into something you can ask for at the shop. */
function buyText(it, servings){
  if(servings <= 0) return {main:"0", sub:""};
  if(it.count){
    const c = Math.ceil(servings * it.count - 1e-9);
    return {main: c+" "+plural(it.pn, c), sub:""};
  }
  if(it.ml){
    const ml = servings * it.ml;
    if(ml >= 1000) return {main: (Math.ceil(ml/1000*2)/2)+" L", sub: Math.round(ml)+" ml needed"};
    return {main: Math.round(ml)+" ml", sub:""};
  }
  const g = servings * it.g;
  let main;
  if(g >= 1000) main = (Math.ceil(g/250)*0.25).toString().replace(/\.0+$/,"")+" kg";
  else if(g >= 100) main = Math.ceil(g/50)*50+" g";
  else main = Math.ceil(g/10)*10+" g";
  const sub = it.piece ? "≈ "+Math.ceil(g/it.piece)+" "+plural(it.pn, Math.ceil(g/it.piece)) : "";
  return {main, sub, kg: g/1000};
}
function plural(w, n){ if(!w) return ""; if(n === 1) return w; if(w.endsWith("y") && !w.endsWith("ey")) return w.slice(0,-1)+"ies"; if(w === "tomato" || w === "potato") return w+"es"; if(w === "loaf") return "loaves"; if(w === "head") return "heads"; return w+"s" }

/* Build the shopping list: merged rows by item id, grouped by category. */
function buildList(){
  const rows = {};
  GROUPS.forEach(g => allocate(g).forEach(a => {
    const id = a.it.merge || a.it.id;
    if(st.hidden[id]) return;
    if(a.base <= 0 && a.total <= 0 && !st.out[a.it.id]) return;
    const r = rows[id] || (rows[id] = {id, cat:g.cat, n:a.it.n, it:a.it, servings:0, groups:[], from:[], out:!!st.out[a.it.id], outKey:a.it.id});
    r.servings += a.total * (a.it.count || 1) / (r.it.count || 1); // merged rows (dinner bread) count in the base item's units
    r.groups.push(g); r.from.push(...a.from);
    if(!st.out[a.it.id]) r.out = false;
  }));
  st.custom.forEach(c => { if(!st.hidden[c.id]) rows[c.id] = {id:c.id, cat:c.cat, n:c.n, custom:c, servings:1, groups:[], from:[], out:!!st.out[c.id], outKey:c.id} });
  return Object.values(rows);
}
function rowQty(r){
  if(r.custom) return {main: r.custom.qty || "", sub: r.custom.note || ""};
  return buyText(r.it, r.servings);
}
function rowPrice(r){
  if(r.custom) return r.custom.usd ? +r.custom.usd : 0;
  if(r.it.upc && r.it.piece) return r.it.upc * Math.ceil(r.servings * r.it.g / r.it.piece - 1e-9);
  const q = buyText(r.it, r.servings);
  if(r.it.usd && q.kg) return r.it.usd * Math.max(q.kg, 0);
  return 0;
}

/* ============ views ============ */
function render(){
  document.querySelectorAll(".nav button").forEach(b => b.dataset.view === view ? b.setAttribute("aria-current","page") : b.removeAttribute("aria-current"));
  if(view === "plan") renderPlan(); else if(view === "add") renderAdd(); else renderList();
  save();
}
function renderList(){
  const rows = buildList();
  const active = rows.filter(r => !r.out);
  const got = active.filter(r => st.got[r.id]).length;
  const cost = active.reduce((a,r) => a + rowPrice(r), 0);
  const unknown = active.filter(r => !rowPrice(r)).length;
  const byCat = CATS.map(c => [c, rows.filter(r => r.cat === c)]).filter(([,l]) => l.length);
  $("#app").innerHTML = `
    <header class="top"><div class="brand">Groceries</div><a class="back" href="../">Gym Log</a></header>
    <section class="summary">
      <div><div class="big">${got} / ${active.length}</div><div class="muted small">in the basket, for ${st.days} days</div></div>
      ${st.prices ? `<div style="text-align:right"><div style="font:700 26px var(--num)">≈ $${cost.toFixed(2)}</div><div class="muted small">${unknown} item${unknown === 1 ? "" : "s"} unpriced</div></div>` : "<div></div>"}
      <div class="meter"><i style="width:${active.length ? got/active.length*100 : 0}%"></i></div>
    </section>
    <div class="actions">
      <button class="pill" data-act="share">Share list</button>
      <button class="pill" data-act="newweek">New week</button>
      <button class="pill" data-act="hidegot">${st.hideGot ? "Show checked" : "Hide checked"}</button>
    </div>
    ${byCat.map(([c, list]) => `<section class="panel"><div class="cat"><h2>${c}</h2><span class="muted small">${list.filter(r => st.got[r.id] && !r.out).length}/${list.filter(r => !r.out).length}</span></div>
      ${list.filter(r => !(st.hideGot && st.got[r.id])).map(r => itemHTML(r)).join("") || '<p class="muted small" style="padding:8px 0">All checked.</p>'}
    </section>`).join("")}
    <section class="panel"><div class="cat"><h2>Check you still have</h2></div>
      ${PANTRY.map(p => `<div class="item ${st.got[p.id] ? "got" : ""}"><button class="check" data-got="${p.id}" aria-label="Have ${esc(p.n)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></button><div><div class="name">${esc(p.n)}</div><div class="sub">${esc(p.why)}</div></div><div></div></div>`).join("")}
    </section>
    <p class="muted small" style="margin:14px 2px 0">Prices are rough estimates from Lebanon's Ministry of Economy survey (Sept 2026) and supermarket sites. Vegetable shops are usually cheaper.</p>`;
}
function itemHTML(r){
  const q = rowQty(r), p = rowPrice(r);
  const g0 = r.groups[0];
  const why = r.custom ? (r.custom.note || "Added by you") : g0 && g0.items.length > 1 ? "For "+g0.name.toLowerCase()+(g0.perDay === "training" ? "" : g0.fixed != null ? "" : " ("+r1(perDayOf(g0))+" "+g0.unit+(perDayOf(g0) === 1 ? "" : "s")+" a day)") : (g0 ? g0.why : "");
  const alt = r.groups.length && r.groups[0].items.length > 1 ? nextAlt(r) : "";
  return `<div class="item ${st.got[r.id] && !r.out ? "got" : ""} ${r.out ? "out" : ""}">
    <button class="check" data-got="${r.id}" aria-label="Got ${esc(r.n)}" ${r.out ? "disabled" : ""}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12l5 5 9-10"/></svg></button>
    <div><div class="name">${esc(r.n)}</div>
      ${r.out ? `<div class="moved">Not available${alt ? ": moved to "+esc(alt) : ""}</div>` : r.from.length ? `<div class="moved">Includes the share of ${esc([...new Set(r.from)].join(", "))} (not available)</div>` : `<div class="sub">${esc(why)}</div>`}
      ${(r.groups.length && r.groups[0].items.length > 1) || r.custom ? `<button class="out-btn" data-out="${r.outKey}">${r.out ? "Found it after all" : "Not available"}</button>` : ""}
    </div>
    <div class="qty">${r.out ? "" : esc(q.main)}${!r.out && (q.sub || (st.prices && p)) ? `<small>${esc(q.sub)}${q.sub && st.prices && p ? " · " : ""}${st.prices && p ? "$"+p.toFixed(2) : ""}</small>` : ""}</div>
  </div>`;
}
function nextAlt(r){
  const g = r.groups[0], i = g.items.findIndex(x => x.id === r.outKey);
  for(let k = 1; k < g.items.length; k++){ const b = g.items[(i+k) % g.items.length]; if(!st.out[b.id]) return b.n; }
  return "";
}
function renderPlan(){
  $("#app").innerHTML = `
    <header class="top"><div class="brand">My plan</div><button class="link" data-act="reset">Reset to the doctor's plan</button></header>
    <section class="panel">
      <div class="field"><label>Days to shop for<small>Usually 7</small></label>${stepper("days", st.days, 1)}</div>
      <div class="field"><label>Training days this week<small>Sets the laban cups</small></label>${stepper("training", st.training, 1)}</div>
      <div class="field"><label>Show price estimates</label><button class="pill" data-act="prices">${st.prices ? "On" : "Off"}</button></div>
    </section>
    ${GROUPS.map(g => {
      const multi = g.items.length > 1, total = weekServings(g), sum = g.items.reduce((a,it) => a + Math.max(0, shareOf(g,it)), 0);
      return `<section class="panel"><h3>${esc(g.name)}</h3><p class="muted small" style="margin:2px 0 4px">${esc(g.why)}</p>
        ${g.perDay === "training" ? "" : `<div class="field"><label>${g.fixed != null ? "Per week" : "Per day"}<small>${esc(g.unit)}</small></label>${stepper("pd:"+g.id, r1(perDayOf(g)), g.fixed != null ? 1 : (g.perDay >= 6 ? 1 : 0.5))}</div>`}
        ${multi ? `<div class="groupsum ${Math.abs(sum - total) < 0.6 ? "ok" : "off"}">Week: ${r1(total)} ${esc(g.unit)}${total === 1 ? "" : "s"}. Your mix adds up to ${r1(sum)}${Math.abs(sum - total) < 0.6 ? "." : ", so it's scaled to fit."} If one is out of stock, its share goes to the next one down the list.</div>
          ${g.items.map(it => `<div class="field"><label>${esc(it.n)}${st.out[it.id] ? '<small style="color:var(--red)">Not available this week</small>' : ""}</label>${stepper("sh:"+it.id, r1(shareOf(g,it)), 1)}</div>`).join("")}` : ""}
      </section>`; }).join("")}
    ${st.custom.length ? `<section class="panel"><h3>Your extra items</h3>${st.custom.map(c => `<div class="field"><label>${esc(c.n)}<small>${esc(c.cat)}${c.qty ? ", "+esc(c.qty) : ""}</small></label><button class="link" data-delc="${c.id}">Remove</button></div>`).join("")}</section>` : ""}`;
}
function stepper(key, val, step){
  return `<div class="stepper"><button data-dec="${key}" data-step="${step}" aria-label="Less">−</button><input data-key="${key}" inputmode="decimal" value="${esc(val)}" aria-label="Amount"><button data-inc="${key}" data-step="${step}" aria-label="More">+</button></div>`;
}
function renderAdd(){
  $("#app").innerHTML = `
    <header class="top"><div class="brand">Add item</div></header>
    <section class="panel"><p class="muted small" style="margin:0">For anything outside the plan, like shampoo, coffee or a treat. It stays on the list every week until you remove it in My plan.</p>
      <form class="form" id="addForm">
        <input name="n" required placeholder="Item, e.g. Coffee" aria-label="Item name">
        <div class="two"><input name="qty" placeholder="Amount, e.g. 1 pack" aria-label="Amount"><input name="usd" inputmode="decimal" placeholder="Price $ (optional)" aria-label="Price in dollars"></div>
        <select name="cat" aria-label="Category">${CATS.map(c => `<option>${c}</option>`).join("")}<option>Other</option></select>
        <input name="note" placeholder="Note (optional)" aria-label="Note">
        <button class="cta" type="submit">Add to the list</button>
      </form></section>
    <section class="panel"><h3>Change the plan instead?</h3><p class="muted small" style="margin:4px 0 10px">To eat more or less of something from the doctor's plan, or to change the mix (say more cucumbers, fewer tomatoes), use My plan.</p><button class="pill" data-view="plan">Open My plan</button></section>`;
}

/* ============ events ============ */
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600) }
function setKey(key, v){
  v = Math.max(0, Math.round(v*100)/100);
  if(key === "days") st.days = Math.max(1, Math.round(v));
  else if(key === "training") st.training = Math.round(v);
  else if(key.startsWith("pd:")) st.perDay[key.slice(3)] = v;
  else if(key.startsWith("sh:")) st.shares[key.slice(3)] = v;
}
function curVal(key){ const i = document.querySelector(`input[data-key="${key}"]`); return parseFloat(i.value) || 0 }
document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if(!t) return; const d = t.dataset;
  if(d.view){ view = d.view; render(); window.scrollTo(0,0); return; }
  if(d.got){ st.got[d.got] = !st.got[d.got]; try{ navigator.vibrate && navigator.vibrate(15) }catch(e){} render(); return; }
  if(d.out){
    st.out[d.out] = !st.out[d.out];
    if(st.out[d.out]){
      const g = GROUPS.find(g => g.items.some(x => x.id === d.out));
      if(g){ const r = {groups:[g], outKey:d.out}; const alt = nextAlt(r); toast(alt ? "Moved to "+alt+". Quantity updated." : "Nothing left in this group to swap to."); }
    }
    render(); return;
  }
  if(d.inc || d.dec){ const key = d.inc || d.dec; setKey(key, curVal(key) + (d.inc ? 1 : -1) * (+d.step)); render(); return; }
  if(d.delc){ st.custom = st.custom.filter(c => c.id !== d.delc); render(); return; }
  switch(d.act){
    case "newweek": if(confirm("Start a new week? This unchecks everything and marks all items as available again.")){ st.got = {}; st.out = {}; render(); toast("New week. Everything's back on the list."); } break;
    case "hidegot": st.hideGot = !st.hideGot; render(); break;
    case "prices": st.prices = !st.prices; render(); break;
    case "reset": if(confirm("Reset amounts and mixes to the doctor's plan? Your extra items stay.")){ st.perDay = {}; st.shares = {}; st.days = 7; st.training = 4; render(); } break;
    case "share": {
      const rows = buildList().filter(r => !r.out && !st.got[r.id]);
      const text = "Groceries ("+st.days+" days)\n" + CATS.map(c => { const l = rows.filter(r => r.cat === c); return l.length ? "\n"+c+"\n"+l.map(r => "- "+r.n+": "+rowQty(r).main).join("\n") : "" }).join("") + "\n";
      if(navigator.share) navigator.share({title:"Groceries", text}).catch(() => {});
      else if(navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast("List copied. Paste it in WhatsApp or Notes."));
      break;
    }
  }
});
document.addEventListener("change", ev => { const k = ev.target.dataset && ev.target.dataset.key; if(k){ setKey(k, parseFloat(ev.target.value) || 0); render(); } });
document.addEventListener("submit", ev => {
  if(ev.target.id !== "addForm") return; ev.preventDefault();
  const f = new FormData(ev.target), n = (f.get("n") || "").trim(); if(!n) return;
  st.custom.push({id:"c"+Date.now(), n, qty:(f.get("qty") || "").trim(), usd:parseFloat(f.get("usd")) || 0, cat:f.get("cat"), note:(f.get("note") || "").trim()});
  save(); toast(n+" added to the list."); view = "list"; render();
});
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("../sw.js").catch(() => {});
try{ const th = localStorage.getItem("gymlog-theme"); if(th) document.documentElement.dataset.theme = th }catch(e){}
if(location.hash === "#plan") view = "plan";
render();
</script>
</body>
</html>
